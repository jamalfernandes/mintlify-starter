<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" role="img" aria-label="Seven steps in a line: new project, design, gate, grill, tickets, AFK, QA, with QA looping back to tickets"><style>svg{color:#1D1D1B}@media (prefers-color-scheme:dark){svg{color:#E8E8E6}}</style>
      <defs>
        <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
        </marker>
        <marker id="ar2a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#1E6473"/>
        </marker>
      </defs>
      <g font-size="11.5" fill="currentColor">
        <rect x="0"   y="40" width="104" height="40" rx="3" fill="currentColor" opacity=".09"/>
        <rect x="0"   y="40" width="104" height="40" rx="3" fill="none" stroke="currentColor" opacity=".4"/>
        <text x="52" y="58" text-anchor="middle">1 · new</text>
        <text x="52" y="72" text-anchor="middle" opacity=".6">project</text>

        <rect x="128" y="40" width="104" height="40" rx="3" fill="currentColor" opacity=".09"/>
        <rect x="128" y="40" width="104" height="40" rx="3" fill="none" stroke="currentColor" opacity=".4"/>
        <text x="180" y="58" text-anchor="middle">2 · design</text>
        <text x="180" y="72" text-anchor="middle" opacity=".6">skip for API</text>

        <rect x="256" y="40" width="88" height="40" rx="3" fill="#9C6B22" opacity=".16"/>
        <rect x="256" y="40" width="88" height="40" rx="3" fill="none" stroke="#9C6B22" opacity=".8"/>
        <text x="300" y="58" text-anchor="middle" fill="#9C6B22">3 · gate</text>
        <text x="300" y="72" text-anchor="middle" fill="#9C6B22" opacity=".8">you decide</text>

        <rect x="368" y="40" width="96" height="40" rx="3" fill="currentColor" opacity=".09"/>
        <rect x="368" y="40" width="96" height="40" rx="3" fill="none" stroke="currentColor" opacity=".4"/>
        <text x="416" y="58" text-anchor="middle">4 · grill</text>
        <text x="416" y="72" text-anchor="middle" opacity=".6">one feature</text>

        <rect x="488" y="40" width="96" height="40" rx="3" fill="currentColor" opacity=".09"/>
        <rect x="488" y="40" width="96" height="40" rx="3" fill="none" stroke="currentColor" opacity=".4"/>
        <text x="536" y="58" text-anchor="middle">5 · tickets</text>
        <text x="536" y="72" text-anchor="middle" opacity=".6">into Linear</text>

        <rect x="608" y="40" width="96" height="40" rx="3" fill="#1E6473" opacity=".16"/>
        <rect x="608" y="40" width="96" height="40" rx="3" fill="none" stroke="#1E6473" opacity=".8"/>
        <text x="656" y="58" text-anchor="middle" fill="#1E6473">6 · AFK</text>
        <text x="656" y="72" text-anchor="middle" fill="#1E6473" opacity=".8">agent builds</text>

        <rect x="728" y="40" width="96" height="40" rx="3" fill="#9C6B22" opacity=".16"/>
        <rect x="728" y="40" width="96" height="40" rx="3" fill="none" stroke="#9C6B22" opacity=".8"/>
        <text x="776" y="58" text-anchor="middle" fill="#9C6B22">7 · QA</text>
        <text x="776" y="72" text-anchor="middle" fill="#9C6B22" opacity=".8">you click it</text>
      </g>
      <g stroke="currentColor" opacity=".45" fill="none" marker-end="url(#ar2)">
        <line x1="106" y1="60" x2="124" y2="60"/><line x1="234" y1="60" x2="252" y2="60"/>
        <line x1="346" y1="60" x2="364" y2="60"/><line x1="466" y1="60" x2="484" y2="60"/>
        <line x1="586" y1="60" x2="604" y2="60"/><line x1="706" y1="60" x2="724" y2="60"/>
      </g>
      <path d="M776 82 L776 118 L536 118 L536 84" fill="none" stroke="#1E6473" opacity=".75" marker-end="url(#ar2a)"/>
      <text x="656" y="134" font-size="11.5" text-anchor="middle" fill="#1E6473">every finding becomes a new ticket</text>
    </svg>