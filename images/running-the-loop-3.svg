<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="Diagram of the host machine and the container, showing that only one worktree folder is shared between them and everything else on the Mac is invisible to the agent"><style>svg{color:#1D1D1B}@media (prefers-color-scheme:dark){svg{color:#E8E8E6}}</style>
      <defs>
        <marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
        </marker>
      </defs>

      <!-- host -->
      <rect x="0" y="24" width="400" height="352" rx="4" fill="none" stroke="currentColor" opacity=".45"/>
      <text x="16" y="16" font-size="12.5" font-weight="600" fill="currentColor">Your Mac</text>

      <rect x="20" y="46" width="360" height="52" rx="3" fill="currentColor" opacity=".07"/>
      <text x="34" y="66" font-size="12" fill="currentColor">Your repo, all branches and history</text>
      <text x="34" y="84" font-size="11" font-family="monospace" fill="currentColor" opacity=".55">~/DevProj/my-api/.git</text>

      <rect x="20" y="112" width="360" height="66" rx="3" fill="#1E6473" opacity=".14"/>
      <rect x="20" y="112" width="360" height="66" rx="3" fill="none" stroke="#1E6473" opacity=".8"/>
      <text x="34" y="132" font-size="12" font-weight="600" fill="#1E6473">The worktree  ← the only shared thing</text>
      <text x="34" y="150" font-size="11" font-family="monospace" fill="#1E6473" opacity=".8">.sandcastle/worktrees/&lt;run&gt;</text>
      <text x="34" y="168" font-size="11" fill="#1E6473" opacity=".8">a throwaway checkout, made per run</text>

      <rect x="20" y="192" width="360" height="46" rx="3" fill="currentColor" opacity=".07"/>
      <text x="34" y="212" font-size="12" fill="currentColor">Your tokens</text>
      <text x="34" y="228" font-size="11" font-family="monospace" fill="currentColor" opacity=".55">.sandcastle/.env → passed in as variables</text>

      <g opacity=".5">
        <rect x="20" y="252" width="360" height="104" rx="3" fill="none" stroke="currentColor" stroke-dasharray="4 3"/>
        <text x="34" y="272" font-size="12" fill="currentColor">Invisible to the agent</text>
        <text x="34" y="292" font-size="11" font-family="monospace" fill="currentColor">~/.ssh   ~/Documents   your keychain</text>
        <text x="34" y="310" font-size="11" font-family="monospace" fill="currentColor">every other repo you own</text>
        <text x="34" y="330" font-size="11" font-family="monospace" fill="currentColor">the rest of ~/DevProj</text>
        <text x="34" y="348" font-size="11" fill="currentColor">and the .git folder itself</text>
      </g>

      <!-- container -->
      <rect x="500" y="24" width="400" height="352" rx="4" fill="none" stroke="#1E6473" opacity=".7"/>
      <text x="516" y="16" font-size="12.5" font-weight="600" fill="#1E6473">The container</text>
      <text x="612" y="16" font-size="11" fill="#1E6473" opacity=".7">from image sandcastle:node22</text>

      <rect x="520" y="46" width="360" height="52" rx="3" fill="currentColor" opacity=".07"/>
      <text x="534" y="66" font-size="12" fill="currentColor">Linux, Node 22, git, gh, jq, claude</text>
      <text x="534" y="84" font-size="11" fill="currentColor" opacity=".55">user "agent", same numeric id as you</text>

      <rect x="520" y="112" width="360" height="66" rx="3" fill="#1E6473" opacity=".14"/>
      <rect x="520" y="112" width="360" height="66" rx="3" fill="none" stroke="#1E6473" opacity=".8"/>
      <text x="534" y="132" font-size="12" font-weight="600" fill="#1E6473">The same worktree, mounted here</text>
      <text x="534" y="150" font-size="11" font-family="monospace" fill="#1E6473" opacity=".8">/home/agent/workspace</text>
      <text x="534" y="168" font-size="11" fill="#1E6473" opacity=".8">edits here appear on your Mac instantly</text>

      <rect x="520" y="192" width="360" height="46" rx="3" fill="currentColor" opacity=".07"/>
      <text x="534" y="212" font-size="12" fill="currentColor">The linear command</text>
      <text x="534" y="228" font-size="11" font-family="monospace" fill="currentColor" opacity=".55">workspace/.sandcastle/bin/linear</text>

      <rect x="520" y="252" width="360" height="46" rx="3" fill="currentColor" opacity=".07"/>
      <text x="534" y="272" font-size="12" fill="currentColor">The agent, running claude</text>
      <text x="534" y="288" font-size="11" fill="currentColor" opacity=".55">reading .sandcastle/prompt.md</text>

      <!-- the mount -->
      <line x1="382" y1="145" x2="516" y2="145" stroke="#1E6473" stroke-width="2" opacity=".9"/>
      <text x="449" y="138" font-size="11" text-anchor="middle" fill="#1E6473" font-weight="600">one shared folder</text>
      <text x="449" y="162" font-size="10.5" text-anchor="middle" fill="#1E6473" opacity=".75">(a "bind mount")</text>
      <line x1="382" y1="214" x2="516" y2="214" stroke="currentColor" opacity=".4" marker-end="url(#ar3)"/>
    </svg>