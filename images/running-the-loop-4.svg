<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-label="The eight stages of one AFK iteration, from creating a worktree through to extracting commits and tearing the container down"><style>svg{color:#1D1D1B}@media (prefers-color-scheme:dark){svg{color:#E8E8E6}}</style>
      <defs>
        <marker id="ar4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
        </marker>
      </defs>
      <g font-size="12" fill="currentColor">
        <g>
          <rect x="60" y="0" width="640" height="42" rx="3" fill="currentColor" opacity=".07"/>
          <text x="14" y="26" font-family="monospace" font-size="11" opacity=".55">1</text>
          <text x="76" y="19" font-weight="600">Make a worktree</text>
          <text x="76" y="34" font-size="11" opacity=".65">a fresh throwaway checkout of your branch, under .sandcastle/worktrees/</text>
        </g>
        <g>
          <rect x="60" y="54" width="640" height="42" rx="3" fill="currentColor" opacity=".07"/>
          <text x="14" y="80" font-family="monospace" font-size="11" opacity=".55">2</text>
          <text x="76" y="73" font-weight="600">Start the container</text>
          <text x="76" y="88" font-size="11" opacity=".65">from sandcastle:node22, with that worktree mounted and your tokens passed in</text>
        </g>
        <g>
          <rect x="60" y="108" width="640" height="42" rx="3" fill="currentColor" opacity=".07"/>
          <text x="14" y="134" font-family="monospace" font-size="11" opacity=".55">3</text>
          <text x="76" y="127" font-weight="600">Run setup</text>
          <text x="76" y="142" font-size="11" opacity=".65">npm install, so the tests have what they need</text>
        </g>
        <g>
          <rect x="60" y="162" width="640" height="52" rx="3" fill="#1E6473" opacity=".15"/>
          <rect x="60" y="162" width="640" height="52" rx="3" fill="none" stroke="#1E6473" opacity=".75"/>
          <text x="14" y="192" font-family="monospace" font-size="11" fill="#1E6473">4</text>
          <text x="76" y="182" font-weight="600" fill="#1E6473">Fill in the prompt</text>
          <text x="76" y="197" font-size="11" fill="#1E6473" opacity=".85">runs `linear ready` INSIDE the container and pastes the backlog into the prompt</text>
          <text x="76" y="210" font-size="11" fill="#1E6473" opacity=".7">this is the step that fails if the Linear key is missing or wrong</text>
        </g>
        <g>
          <rect x="60" y="226" width="640" height="52" rx="3" fill="#1E6473" opacity=".15"/>
          <rect x="60" y="226" width="640" height="52" rx="3" fill="none" stroke="#1E6473" opacity=".75"/>
          <text x="14" y="256" font-family="monospace" font-size="11" fill="#1E6473">5</text>
          <text x="76" y="246" font-weight="600" fill="#1E6473">Run the agent</text>
          <text x="76" y="261" font-size="11" fill="#1E6473" opacity=".85">claude picks one ticket, writes tests, writes code, runs your checks, commits</text>
          <text x="76" y="274" font-size="11" fill="#1E6473" opacity=".7">the long one. minutes to tens of minutes</text>
        </g>
        <g>
          <rect x="60" y="290" width="640" height="42" rx="3" fill="currentColor" opacity=".07"/>
          <text x="14" y="316" font-family="monospace" font-size="11" opacity=".55">6</text>
          <text x="76" y="309" font-weight="600">Watch for the finish signal</text>
          <text x="76" y="324" font-size="11" opacity=".65">the agent prints COMPLETE when the backlog is empty, which ends the whole run</text>
        </g>
        <g>
          <rect x="60" y="344" width="640" height="42" rx="3" fill="currentColor" opacity=".07"/>
          <text x="14" y="370" font-family="monospace" font-size="11" opacity=".55">7</text>
          <text x="76" y="363" font-weight="600">Collect the commits</text>
          <text x="76" y="378" font-size="11" opacity=".65">onto the afk/&lt;timestamp&gt; branch in your real repo. Nothing is pushed</text>
        </g>
        <g>
          <rect x="60" y="398" width="640" height="42" rx="3" fill="currentColor" opacity=".07"/>
          <text x="14" y="424" font-family="monospace" font-size="11" opacity=".55">8</text>
          <text x="76" y="417" font-weight="600">Throw the container away</text>
          <text x="76" y="432" font-size="11" opacity=".65">then go back to step 1 for the next ticket, until --max is reached</text>
        </g>
      </g>
      <g stroke="currentColor" opacity=".35" fill="none" marker-end="url(#ar4)">
        <line x1="34" y1="44" x2="34" y2="52"/><line x1="34" y1="98" x2="34" y2="106"/>
        <line x1="34" y1="152" x2="34" y2="160"/><line x1="34" y1="216" x2="34" y2="224"/>
        <line x1="34" y1="280" x2="34" y2="288"/><line x1="34" y1="334" x2="34" y2="342"/>
        <line x1="34" y1="388" x2="34" y2="396"/>
      </g>
      <path d="M726 419 L740 419 L740 20 L706 20" fill="none" stroke="currentColor" opacity=".4" marker-end="url(#ar4)"/>
      <text x="752" y="230" font-size="11" fill="currentColor" opacity=".6" transform="rotate(90 752 230)" text-anchor="middle">next ticket</text>
    </svg>